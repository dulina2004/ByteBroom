[package]
name = "bytebroom"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, lightweight disk analyzer and cleanup tool for developers."
publish = false

[dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }

[build-dependencies]
slint-build = "=1.19.0"
